components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de sessão de agente/gestor ou morador identificado. Provedor de identidade externo.
    TrackerSecret:
      type: apiKey
      in: header
      name: X-Acompanhamento-Token
      description: Segredo de 32 bytes gerado no cliente, apresentado em base64url (43 caracteres) para
        consultar/alterar seu próprio relato. Nunca enviar na URL.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - erro
      - mensagem
      - requisicao_id
      properties:
        erro:
          type: string
        mensagem:
          type: string
        requisicao_id:
          type: string
          format: uuid
        detalhes:
          type: object
          additionalProperties: true
    Categoria:
      type: object
      required:
      - id
      - codigo
      - nome
      - grupo
      properties:
        id:
          type: integer
        codigo:
          type: string
        nome:
          type: string
        grupo:
          type: string
          enum:
          - vetor
          - roedor
          - peconhento
          - praga_sanitaria
          - outro
    Bairro:
      type: object
      required:
      - id
      - nome
      properties:
        id:
          type: integer
        nome:
          type: string
    Localizacao:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    CriarOcorrencia:
      type: object
      additionalProperties: false
      required:
      - idempotencia_uuid
      - segredo_acompanhamento
      - categoria_id
      - descricao
      - localizacao
      - origem_localizacao
      properties:
        idempotencia_uuid:
          type: string
          format: uuid
          description: UUID persistido no aparelho durante a fila offline; reenvios usam o mesmo valor.
        segredo_acompanhamento:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description: 43 caracteres base64url (32 bytes aleatórios criados pelo cliente); API guarda
            somente hash SHA-256.
        categoria_id:
          type: integer
          minimum: 1
        bairro_id:
          type: integer
          minimum: 1
          nullable: true
        descricao:
          type: string
          minLength: 10
          maxLength: 2000
        localizacao:
          $ref: '#/components/schemas/Localizacao'
        origem_localizacao:
          type: string
          enum:
          - gps
          - manual
        observado_em:
          type: string
          format: date-time
          nullable: true
    OcorrenciaCriada:
      type: object
      required:
      - id
      - protocolo
      - status
      - criado_em
      properties:
        id:
          type: string
          format: uuid
        protocolo:
          type: string
          maxLength: 24
        status:
          type: string
          enum: *id004
        criado_em:
          type: string
          format: date-time
        reenvio:
          type: boolean
          description: true se um envio idempotente retornou uma ocorrência previamente aceita.
    EventoPublico:
      type: object
      required:
      - status
      - alterado_em
      properties:
        status:
          type: string
          enum: *id004
        alterado_em:
          type: string
          format: date-time
        descricao_curta:
          type: string
    Acompanhamento:
      type: object
      required:
      - protocolo
      - categoria
      - status
      - criado_em
      - linha_tempo
      properties:
        protocolo:
          type: string
        categoria:
          type: string
        status:
          type: string
          enum: *id004
        criado_em:
          type: string
          format: date-time
        linha_tempo:
          type: array
          items:
            $ref: '#/components/schemas/EventoPublico'
        ultima_orientacao_publicavel:
          type: string
          nullable: true
    Evidencia:
      type: object
      required:
      - id
      - mime
      - tamanho_bytes
      - enviado_em
      properties:
        id:
          type: string
          format: uuid
        mime:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
        tamanho_bytes:
          type: integer
          minimum: 1
          maximum: 10485760
        enviado_em:
          type: string
          format: date-time
    Confirmacao:
      type: object
      required:
      - id
      - ocorrencia_id
      - criado_em
      properties:
        id:
          type: string
          format: uuid
        ocorrencia_id:
          type: string
          format: uuid
        criado_em:
          type: string
          format: date-time
    RetornoNovo:
      type: object
      additionalProperties: false
      required:
      - percepcao
      properties:
        percepcao:
          type: string
          enum: &id005
          - melhorou
          - persiste
          - nao_sabe
        comentario:
          type: string
          maxLength: 2000
          nullable: true
    Retorno:
      type: object
      required:
      - id
      - percepcao
      - informado_em
      properties:
        id:
          type: string
          format: uuid
        percepcao:
          type: string
          enum: *id005
        informado_em:
          type: string
          format: date-time
    AreaAgregada:
      type: object
      required:
      - bairro_id
      - bairro
      - categoria
      - periodo
      - total_registros
      properties:
        bairro_id:
          type: integer
        bairro:
          type: string
        categoria:
          type: string
        periodo:
          type: string
          pattern: ^\d{4}-\d{2}$
        total_registros:
          type: integer
          minimum: 5
    OcorrenciaGestao:
      type: object
      required:
      - id
      - protocolo
      - categoria_id
      - descricao
      - localizacao
      - origem_localizacao
      - status
      - criado_em
      properties:
        id:
          type: string
          format: uuid
        protocolo:
          type: string
        categoria_id:
          type: integer
        bairro_id:
          type: integer
          nullable: true
        descricao:
          type: string
        localizacao:
          $ref: '#/components/schemas/Localizacao'
        origem_localizacao:
          type: string
          enum:
          - gps
          - manual
        status:
          type: string
          enum: *id004
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time
        total_confirmacoes:
          type: integer
          minimum: 0
        total_evidencias:
          type: integer
          minimum: 0
    ValidacaoNova:
      type: object
      additionalProperties: false
      required:
      - resultado
      properties:
        resultado:
          type: string
          enum: &id006
          - confirmada
          - descartada
          - inconclusiva
        observacao:
          type: string
          maxLength: 2000
          nullable: true
    Validacao:
      type: object
      required:
      - id
      - ocorrencia_id
      - resultado
      - validado_em
      properties:
        id:
          type: string
          format: uuid
        ocorrencia_id:
          type: string
          format: uuid
        resultado:
          type: string
          enum: *id006
        observacao:
          type: string
          nullable: true
        validado_em:
          type: string
          format: date-time
    IntervencaoNova:
      type: object
      additionalProperties: false
      required:
      - tipo_acao
      - descricao
      properties:
        tipo_acao:
          type: string
          minLength: 2
          maxLength: 90
        descricao:
          type: string
          minLength: 10
          maxLength: 2000
    Intervencao:
      type: object
      required:
      - id
      - ocorrencia_id
      - tipo_acao
      - situacao
      - iniciada_em
      properties:
        id:
          type: string
          format: uuid
        ocorrencia_id:
          type: string
          format: uuid
        tipo_acao:
          type: string
        descricao:
          type: string
        situacao:
          type: string
          enum:
          - planejada
          - em_execucao
          - concluida
          - cancelada
        iniciada_em:
          type: string
          format: date-time
        concluida_em:
          type: string
          format: date-time
          nullable: true
    AtualizarIntervencao:
      type: object
      additionalProperties: false
      required:
      - situacao
      properties:
        situacao:
          type: string
          enum:
          - em_execucao
          - concluida
          - cancelada
    MudancaStatus:
      type: object
      additionalProperties: false
      required:
      - status
      - motivo
      properties:
        status:
          type: string
          enum: *id004
        motivo:
          type: string
          minLength: 5
          maxLength: 2000
    Indicadores:
      type: object
      required:
      - periodo_inicio
      - periodo_fim
      - total_ocorrencias
      - total_validadas
      - total_com_encaminhamento
      - tempo_medio_horas_ate_validacao
      properties:
        periodo_inicio:
          type: string
          format: date
        periodo_fim:
          type: string
          format: date
        total_ocorrencias:
          type: integer
        total_validadas:
          type: integer
        total_com_encaminhamento:
          type: integer
        tempo_medio_horas_ate_validacao:
          type: number
          nullable: true
    AcessoArquivo:
      type: object
      required:
      - url_temporaria
      - expira_em
      properties:
        url_temporaria:
          type: string
          format: uri
          description: URL assinada com expiração curta; só entregue a usuários autorizados.
        expira_em:
          type: string
          format: date-time
security: []
